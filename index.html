<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上门体育·新疆师范大学体育学院</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E7C5C'/%3E%3Cpath d='M18 44 L26 20 L34 44' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='42' cy='22' r='7' fill='%23FF8A3D'/%3E%3C/svg%3E">
<style>
:root{--green:#0E7C5C;--green-d:#0A5E46;--green-l:#E3F3EC;--orange:#FF8A3D;--orange-l:#FFF2E7;--blue:#2F7BE5;--blue-l:#E9F1FD;--red:#E5484D;--red-l:#FDEBEC;--gray:#F5F6F6;--card:#FFFFFF;--line:#E8EDEA;--t1:#16201B;--t2:#5E6B65;--t3:#9AA6A0;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#EDF0EE;color:var(--t1);font-size:15px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--card);position:relative;box-shadow:0 0 24px rgba(0,0,0,.08)}
@media(min-width:520px){body{padding:16px 0}.app{border-radius:22px;overflow:hidden}}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--t1);width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.navbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;min-height:48px}
.navbar .nav-title{font-size:17px;font-weight:700}
.navbar .nav-back{display:flex;align-items:center;gap:2px;color:var(--t2);font-size:14px;padding:4px}
.navbar .nav-right{display:flex;gap:8px}
.navbar .role-chip{font-size:12px;color:var(--green);background:var(--green-l);padding:3px 10px;border-radius:20px;font-weight:600}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;color:var(--t3);font-size:11px}
.tabbar .tab.active{color:var(--green);font-weight:600}
.tabbar .tab svg{width:23px;height:23px}
.view{padding:12px 14px 78px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,40,30,.06)}
.sec-title{font-size:16px;font-weight:700;margin:16px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sec-title .more{font-size:13px;color:var(--t3);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge.pending{background:var(--orange-l);color:var(--orange)}
.badge.accepted{background:var(--blue-l);color:var(--blue)}
.badge.doing{background:var(--green-l);color:var(--green)}
.badge.done{background:#EFF2F1;color:var(--t2)}
.badge.canceled{background:var(--red-l);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.block{width:100%}
.btn.primary{background:var(--green);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:#F0F3F1;color:var(--t1)}
.btn.outline{border:1px solid var(--green);color:var(--green);background:#fff}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.flex{display:flex;align-items:center}
.between{justify-content:space-between}
.gap8{gap:8px}.gap4{gap:4px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.t2{color:var(--t2)}.t3{color:var(--t3)}
.f12{font-size:13px}.f13{font-size:13px}.f16{font-size:16px}.f20{font-size:20px}
.bold{font-weight:700}
.price{color:var(--orange);font-weight:700}
.price::before{content:"¥";font-size:.85em;margin-right:1px}
.empty{padding:48px 20px;text-align:center;color:var(--t3);font-size:14px}
.hero{position:relative;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,var(--green) 0%,var(--green-d) 70%);color:#fff;padding:20px 16px;margin-bottom:4px}
.hero .hero-tag{font-size:12px;background:rgba(255,255,255,.16);display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:8px}
.hero h1{font-size:21px;font-weight:800;letter-spacing:.5px}
.hero p{font-size:13px;opacity:.85;margin-top:6px}
.hero .deco{position:absolute;right:-14px;bottom:-18px;opacity:.22}
.hero .deco svg{width:150px;height:150px}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.cat-item{background:var(--gray);border-radius:12px;padding:12px 2px;text-align:center;font-size:13px;color:var(--t2)}
.cat-item .ic{width:36px;height:36px;margin:0 auto 6px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.coach-card{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;position:relative}
.avatar .on{position:absolute;right:0;bottom:2px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:var(--green)}
.stars{color:var(--orange);font-size:12px;letter-spacing:1px}
.svc-item{display:flex;gap:12px;align-items:center}
.svc-ic{width:48px;height:48px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.svc-ic svg{width:26px;height:26px}
.form-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.form-row:last-child{border-bottom:none}
.form-row .label{width:76px;flex:none;color:var(--t2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:20px;background:var(--gray);font-size:13px;color:var(--t2);border:1px solid transparent}
.chip.sel{background:var(--green-l);color:var(--green);border-color:var(--green);font-weight:600}
.summary-box{background:var(--gray);border-radius:12px;padding:12px}
.ord-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ord-body{display:flex;gap:12px;align-items:center}
.ord-line{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--t2)}
.steps{display:flex;align-items:center;margin:10px 0 4px}
.steps .st{flex:1;text-align:center;font-size:11px;color:var(--t3);position:relative}
.steps .st .dot{width:22px;height:22px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;background:#E9EDEA;color:var(--t3);font-size:11px;font-weight:700}
.steps .st.on .dot{background:var(--green);color:#fff}
.steps .st.on{color:var(--green)}
.steps .line{position:absolute;top:11px;left:50%;width:100%;height:2px;background:#E9EDEA}
.steps .st.on .line{background:var(--green)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{background:var(--gray);border-radius:12px;padding:14px 10px;text-align:center}
.stat-card .v{font-size:20px;font-weight:800;color:var(--green)}
.stat-card .k{font-size:12px;color:var(--t2);margin-top:2px}
.admin-head{background:linear-gradient(135deg,#20364B,#0E7C5C);color:#fff;border-radius:var(--radius);padding:18px 16px;margin-bottom:12px}
.admin-head .big{font-size:26px;font-weight:800}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--gray);color:var(--t2)}
.toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:99;background:rgba(20,30,25,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:10px;max-width:80%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none}
.sheet-mask.show{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:18px 18px 0 0;z-index:61;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:none}
.sheet.show{display:block}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.role-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--card)}
.role-card .ric{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ric svg,.grid2 .card svg{width:24px;height:24px}
.navbar .nav-back svg{width:18px;height:18px}
.role-card.on{border-color:var(--green);background:var(--green-l)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="navbar" id="navbar"></div>
  <div class="view" id="view"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900);}
function now(){return new Date().toISOString().slice(0,16).replace('T',' ');}
function fmtTime(s){return (s||'').replace('T',' ').slice(0,16);}
function statusText(s){return {pending:'待接单',accepted:'已接单',doing:'进行中',done:'已完成',canceled:'已取消'}[s]||s;}
const IC={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  service:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2.1-1.6-2-3.4-2.5 1a7.6 7.6 0 0 0-2.6-1.5L14.2 2h-4l-.3 2.6a7.6 7.6 0 0 0-2.6 1.5l-2.5-1-2 3.4 2.1 1.6a7.6 7.6 0 0 0 0 3L3 15.1l2 3.4 2.5-1a7.6 7.6 0 0 0 2.6 1.5l.3 2.6h4l.3-2.6a7.6 7.6 0 0 0 2.6-1.5l2.5 1 2-3.4Z"/></svg>',
  order:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
  coach:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13v5l2-1 2 1v-5"/><circle cx="12" cy="9" r="4.5"/><path d="M12 13.5V21"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>',
  board:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};
const SVC_ICON=[['<circle cx="12" cy="9" r="5"/><path d="M12 14v5M8 21h8"/>','#E5484D'],['<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/>','#2F7BE5'],['<path d="M4 4h7v6H4zM13 4h7v6h-7zM4 14h7v6H4zM13 14h7v6h-7z"/>','#0E7C5C'],['<path d="M12 3v18M5 8c0-2 3-2 3-4M19 8c0-2-3-2-3-4"/>','#8A5CF5'],['<path d="M12 3s6 5.5 6 10a6 6 0 0 1-12 0c0-4.5 6-10 6-10Z"/>','#FF8A3D'],['<path d="M5 21V10M12 21V6M19 21v-7"/><path d="M3 21h18"/>','#E7A700'],['<circle cx="9" cy="9" r="3"/><circle cx="17" cy="14" r="4"/><path d="M6 21v-4M15 21v-4"/>','#2F7BE5'],['<path d="M9 12l3 3 6-6"/><path d="M4 4h16v13a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z"/>','#0E7C5C']];
function svcIcon(i){const [p,c]=SVC_ICON[i%SVC_ICON.length];return `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;}
const KEY='xjnu_sports_db_v1';
let DB=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed();}catch(e){return seed();}}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function seed(){const d={role:'user',balance:200,coachEarn:{},services:[{id:1,cat:'排球',name:'排球专项训练',price:80,unit:'小时',dur:90,hot:1,desc:'垫球、传球、扣球、拦网专项强化，含技战术指导'},{id:2,cat:'排球',name:'排球基础入门',price:60,unit:'小时',dur:90,hot:0,desc:'零基础友好，从垫球姿势到发球接球，带打带教'},{id:3,cat:'篮球',name:'篮球实战训练',price:90,unit:'小时',dur:120,hot:1,desc:'运球、投篮、防守脚步、全场对抗'},{id:4,cat:'篮球',name:'篮球基础教学',price:70,unit:'小时',dur:120,hot:0,desc:'适合新手，投篮姿势纠正、基本运球'},{id:5,cat:'体能',name:'体考冲刺训练',price:100,unit:'小时',dur:90,hot:1,desc:'100米/800米/立定跳远/实心球专项，体育中考提分'},{id:6,cat:'体能',name:'核心体能训练',price:70,unit:'小时',dur:60,hot:0,desc:'力量、耐力、柔韧综合体能提升'},{id:7,cat:'私教',name:'一对一私教课',price:150,unit:'小时',dur:60,hot:1,desc:'按您的目标定制训练计划，全程陪练纠正'},{id:8,cat:'陪练',name:'上门陪练服务',price:50,unit:'小时',dur:60,hot:0,desc:'陪打陪练，约球局、固定球友，操场/球馆上门'}],coaches:[{id:1,name:'阿迪力',major:'排球',intro:'体育教育专业排球专项，校队主攻手，带队训练2年',price:80,rate:5.0,cnt:36,tags:['校队主力','耐心细致']},{id:2,name:'李思雨',major:'排球',intro:'排球专项，二传位置，擅长基础教学与垫传训练',price:70,rate:4.9,cnt:28,tags:['女教练','基础教学']},{id:3,name:'王浩然',major:'篮球',intro:'体育教育篮球专项，院队队长，实战经验丰富',price:90,rate:4.8,cnt:42,tags:['实战派','校队队长']},{id:4,name:'麦尔丹',major:'体能',intro:'田径专项，体考提分教练，辅导学生100+',price:100,rate:5.0,cnt:58,tags:['体考提分','田径专项']},{id:5,name:'赵一凡',major:'私教',intro:'运动训练专业，持有健身教练证，擅长定制化训练',price:150,rate:4.9,cnt:21,tags:['持证教练','定制计划']},{id:6,name:'古丽扎尔',major:'陪练',intro:'排球专项，随和好相处，周末常驻操场约球',price:50,rate:4.7,cnt:15,tags:['随和','球搭子']}],orders:[{id:1001,sid:7,cid:5,date:'2026-10-06',time:'19:00-20:00',place:'昆仑校区 体育训练馆',amount:150,status:'pending',created:'2026-10-04 20:12',user:'张家旗',rating:0,comment:''},{id:1002,sid:5,cid:4,date:'2026-10-08',time:'18:00-19:30',place:'温泉校区 田径场',amount:100,status:'done',created:'2026-10-03 12:30',user:'张家旗',rating:5,comment:'麦教练很专业，体考提分有效果'}]};localStorage.setItem(KEY,JSON.stringify(d));return d;}
let cur='#/home';
function go(h){location.hash=h;}
function render(){const h=location.hash||'#/home';cur=h;const [path,q]=h.slice(1).split('?');const role=DB.role;renderNav(path,role);renderTab(role);renderView(path,q);window.scrollTo(0,0);}
function renderNav(path,role){const titles={'/home':'上门体育','/services':'服务项目','/coaches':'教练团队','/orders':'我的订单','/profile':'我的','/book':'预约下单','/order':'订单详情','/coach':'接单大厅','/coach/orders':'我的接单','/coach/stats':'收入统计','/admin':'管理总览','/admin/orders':'订单管理','/admin/services':'服务管理','/admin/coaches':'教练管理'};const isRoot=['/home','/services','/coaches','/orders','/profile','/coach','/coach/orders','/coach/stats','/admin','/admin/orders','/admin/services','/admin/coaches'].includes(path);let left='';if(!isRoot){left=`<button class="nav-back" onclick="history.back()">${IC.arrow}<span>返回</span></button>`;}const roleName={user:'学生端',coach:'教练端',admin:'管理端'}[role];const chip=path.startsWith('/coach')||path.startsWith('/admin')?'':`<span class="role-chip">${roleName}</span>`;$('navbar').innerHTML=`${left}<div class="nav-title">${titles[path]||'上门体育'}</div><div class="nav-right">${chip}</div>`;}
function renderTab(role){let tabs=[];if(role==='coach'){tabs=[['/coach','接单大厅',IC.home],['/coach/orders','我的接单',IC.order],['/coach/stats','收入统计',IC.stats],['/profile','我的',IC.me]];}else if(role==='admin'){tabs=[['/admin','总览',IC.board],['/admin/orders','订单',IC.order],['/admin/services','服务',IC.service],['/admin/coaches','教练',IC.coach]];}else{tabs=[['/home','首页',IC.home],['/services','服务',IC.service],['/orders','订单',IC.order],['/profile','我的',IC.me]];}const active=cur.split('?')[0];$('tabbar').innerHTML=tabs.map(([p,t,ic])=>`<div class="tab ${active===p?'active':''}" onclick="go('${p}')">${ic}<span>${t}</span></div>`).join('');}
function renderView(path,q){const v=$('view');const fn={'/home':vHome,'/services':vServices,'/coaches':vCoaches,'/orders':vOrders,'/profile':vProfile,'/book':vBook,'/order':vOrderDetail,'/coach':vCoachHome,'/coach/orders':vCoachOrders,'/coach/stats':vCoachStats,'/admin':vAdminHome,'/admin/orders':vAdminOrders,'/admin/services':vAdminServices,'/admin/coaches':vAdminCoaches}[path];v.innerHTML=(fn?fn(q):'<div class="empty">页面不存在</div>');bindEvents(v);}
function bindEvents(root){root.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.nav)));root.querySelectorAll('[data-sheet]').forEach(el=>el.addEventListener('click',()=>openSheet(el.dataset.sheet)));root.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>toast(el.dataset.toast)));root.querySelectorAll('[data-action]:not(select)').forEach(el=>el.addEventListener('click',e=>{const a=el.dataset.action;if(ACTIONS[a])ACTIONS[a](el,e);}));}
function vHome(){const cats=DB.services.reduce((a,s)=>(a.includes(s.cat)?a:a.concat(s.cat)),[]);const hot=DB.coaches.slice(0,3);return `<div class="hero"><div class="hero-tag">新疆师范大学体育学院 · 校内服务</div><h1>上门体育，随时开练</h1><p>专业教练上门训练 · 田径场/球馆/宿舍楼下</p><div class="deco">${IC.coach}</div></div><div class="cat-grid">${cats.map((c,i)=>`<div class="cat-item" data-nav="/services?cat=${encodeURIComponent(c)}"><div class="ic" style="background:${['#E5484D','#2F7BE5','#0E7C5C','#8A5CF5','#FF8A3D','#E7A700','#2F7BE5','#0E7C5C'][i%8]}22;color:${['#E5484D','#2F7BE5','#0E7C5C','#8A5CF5','#FF8A3D','#E7A700','#2F7BE5','#0E7C5C'][i%8]}">${svcIcon(i)}</div>${c}</div>`).join('')}</div><div class="sec-title">热门教练 <span class="more" data-nav="/coaches">全部教练</span></div>${hot.map(c=>coachCard(c)).join('')}<div class="sec-title">精选服务</div>${DB.services.filter(s=>s.hot).slice(0,3).map(s=>svcRow(s)).join('')}<div class="card" style="background:var(--gray);box-shadow:none;font-size:13px;color:var(--t2)"><div class="bold t1" style="color:var(--t1);margin-bottom:6px">服务说明</div>下单后教练接单 → 按时上门训练 → 完成后确认。当前为演示环境，余额为虚拟余额，结算走线下。</div>`;}
function coachCard(c){return `<div class="card coach-card" data-nav="/coaches"><div class="avatar" style="background:${['#0E7C5C','#2F7BE5','#E5484D','#8A5CF5','#FF8A3D','#0A5E46'][c.id%6]}">${esc(c.name[0])}<span class="on"></span></div><div style="flex:1"><div class="flex between"><span class="bold">${esc(c.name)}</span><span class="badge done">${esc(c.major)}</span></div><div class="f12 t2 mt4">${esc(c.intro)}</div><div class="flex between mt4"><span class="stars">★★★★★ ${c.rate.toFixed(1)}</span><span class="price f16">${c.price}</span><span class="f12 t3">/小时</span></div></div><span style="color:var(--t3)">${IC.arrow}</span></div>`;}
function svcRow(s){return `<div class="card svc-item" data-nav="/services"><div class="svc-ic" style="background:${['#E5484D','#2F7BE5','#0E7C5C','#8A5CF5','#FF8A3D','#E7A700','#2F7BE5','#0E7C5C'][s.id%8]}">${svcIcon(s.id)}</div><div style="flex:1"><div class="flex between"><span class="bold">${esc(s.name)}</span><span class="tag">${esc(s.cat)}</span></div><div class="f13 t2 mt4">${esc(s.desc)}</div><div class="f13 t3 mt4">${s.dur}分钟/次</div></div><div style="text-align:right"><div class="price">${s.price}</div><div class="f12 t3">/${s.unit}</div></div></div>`;}
function vServices(){const cats=['全部'].concat(DB.services.reduce((a,s)=>(a.includes(s.cat)?a:a.concat(s.cat)),[]));const qs=new URLSearchParams(location.hash.split('?')[1]||'');const curCat=qs.get('cat')||'全部';const list=curCat==='全部'?DB.services:DB.services.filter(s=>s.cat===curCat);return `<div class="chips" style="margin-bottom:12px;position:sticky;top:48px;background:var(--card);padding:6px 0;z-index:10">${cats.map(c=>`<span class="chip ${curCat===c?'sel':''}" data-nav="/services?cat=${encodeURIComponent(c)}">${c}</span>`).join('')}</div>${list.map(s=>svcRow(s)).join('')}${list.length?`<div class="card" style="background:var(--green-l);box-shadow:none;text-align:center;color:var(--green);font-weight:600" data-nav="/book">立即预约 →</div>`:'<div class="empty">该分类暂无服务</div>'}`;}
function vCoaches(){const major=DB.services.reduce((a,s)=>(a.includes(s.cat)?a:a.concat(s.cat)),[]);const qs=new URLSearchParams(location.hash.split('?')[1]||'');const curM=qs.get('m')||'全部';const list=curM==='全部'?DB.coaches:DB.coaches.filter(c=>c.major===curM);return `<div class="chips" style="margin-bottom:12px">${['全部'].concat(major).map(m=>`<span class="chip ${curM===m?'sel':''}" data-nav="/coaches?m=${encodeURIComponent(m)}">${m}</span>`).join('')}</div>${list.map(c=>coachCard(c)).join('')}${list.length?'':'<div class="empty">暂无该专项教练</div>'}`;}
function vOrders(){const sts=['全部','pending','accepted','doing','done','canceled'];const qs=new URLSearchParams(location.hash.split('?')[1]||'');const cur=qs.get('st')||'全部';const list=cur==='全部'?DB.orders:DB.orders.filter(o=>o.status===cur);list.sort((a,b)=>b.id-a.id);return `<div class="chips" style="margin-bottom:12px;position:sticky;top:48px;background:var(--card);padding:6px 0;z-index:10">${sts.map(s=>`<span class="chip ${cur===s?'sel':''}" data-nav="/orders?st=${s}">${s==='全部'?'全部':statusText(s)}</span>`).join('')}</div>${list.map(o=>orderCard(o)).join('')}${list.length?'':'<div class="empty"><div style="font-size:15px;font-weight:600;color:var(--t2);margin-bottom:4px">暂无'+(cur==='全部'?'订单':statusText(cur)+'订单')+'</div>去首页挑个服务下单吧</div>'}`;}
function orderCard(o){const s=DB.services.find(x=>x.id===o.sid);const c=DB.coaches.find(x=>x.id===o.cid);return `<div class="card" data-nav="/order?id=${o.id}"><div class="ord-head"><span class="bold">${s?esc(s.name):'服务'}</span><span class="badge ${o.status}">${statusText(o.status)}</span></div><div class="ord-body"><div class="avatar" style="width:40px;height:40px;font-size:16px;background:${['#0E7C5C','#2F7BE5','#E5484D','#8A5CF5','#FF8A3D','#0A5E46'][o.cid%6]}">${c?esc(c.name[0]):'?'}</div><div style="flex:1;font-size:13px;color:var(--t2)"><div>教练：${c?esc(c.name):'-'} · ${esc(o.date)} ${esc(o.time)}</div><div class="mt4">${esc(o.place)}</div></div><div><div class="price f16">${o.amount}</div><div class="f11 t3">${fmtTime(o.created).slice(5,16)}</div></div></div></div>`;}
function vProfile(){const role=DB.role;const earn=Object.values(DB.coachEarn).reduce((a,b)=>a+b,0);return `<div class="card" style="background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;text-align:center;padding:22px"><div class="avatar" style="width:64px;height:64px;font-size:24px;margin:0 auto 10px;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.4)">张</div><div class="bold f20">张家旗</div><div class="f12" style="opacity:.85">新疆师范大学体育学院 · 体育教育 25-1 班</div></div><div class="card flex between"><div><div class="t2 f12">虚拟余额</div><div class="f20 bold" style="color:var(--orange)">¥${DB.balance.toFixed(0)}</div></div>${role==='user'?`<button class="btn orange sm" data-action="recharge">+ 充值模拟</button>`:''}${role==='coach'?`<div style="text-align:right"><div class="t2 f12">累计接单收入</div><div class="f20 bold" style="color:var(--green)">¥${earn.toFixed(0)}</div></div>`:''}${role==='admin'?`<div style="text-align:right"><div class="t2 f12">平台订单数</div><div class="f20 bold" style="color:var(--green)">${DB.orders.length}</div></div>`:''}</div><div class="sec-title">切换角色（演示）</div><div class="role-card ${role==='user'?'on':''}" data-action="setrole" data-role="user"><div class="ric" style="background:var(--green)">${IC.home}</div><div style="flex:1"><div class="bold">学生端</div><div class="f12 t2">浏览服务、预约下单、管理我的订单</div></div>${role==='user'?'<span class="badge done">当前</span>':''}</div><div class="role-card ${role==='coach'?'on':''}" data-action="setrole" data-role="coach"><div class="ric" style="background:var(--orange)">${IC.coach}</div><div style="flex:1"><div class="bold">教练端（阿迪力 · 排球）</div><div class="f12 t2">接单大厅、我的接单、收入统计</div></div>${role==='coach'?'<span class="badge done">当前</span>':''}</div><div class="role-card ${role==='admin'?'on':''}" data-action="setrole" data-role="admin"><div class="ric" style="background:#20364B">${IC.board}</div><div style="flex:1"><div class="bold">管理端</div><div class="f12 t2">订单总览、服务项目与教练管理</div></div>${role==='admin'?'<span class="badge done">当前</span>':''}</div><div class="card" style="background:var(--gray);box-shadow:none;font-size:12px;color:var(--t2)">演示说明：单机演示版，数据保存在浏览器本地，三端共用一份数据以便展示完整接单-点单流程。真实上线需接入后端与支付资质。</div>`;}
function vBook(){const qs=new URLSearchParams(location.hash.split('?')[1]||'');const selSid=parseInt(qs.get('sid'))||DB.services[0].id;const selCid=parseInt(qs.get('cid'))||DB.coaches[0].id;const days=[];const base=new Date();for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);days.push(d.toISOString().slice(0,10));}const slots=['17:00-18:00','18:00-19:00','19:00-20:00','20:00-21:00'];const s=DB.services.find(x=>x.id===selSid)||DB.services[0];return `<div class="card"><div class="form-row"><div class="label">服务项目</div><select onchange="go('/book?sid='+this.value+'&cid=${selCid}')">${DB.services.map(x=>`<option value="${x.id}" ${x.id===selSid?'selected':''}>${esc(x.name)} · ¥${x.price}/${x.unit}</option>`).join('')}</select></div><div class="form-row"><div class="label">选择教练</div><div class="chips">${DB.coaches.map(c=>`<span class="chip ${selCid===c.id?'sel':''}" data-nav="/book?sid=${selSid}&cid=${c.id}">${esc(c.name)} ¥${c.price}</span>`).join('')}</div></div><div class="form-row"><div class="label">训练日期</div><div class="chips">${days.map((d,i)=>`<span class="chip sel-pick ${i===0?'sel':''}" data-d="${d}">${i===0?'今天':(i===1?'明天':d.slice(5).replace('-','/'))}</span>`).join('')}</div></div><div class="form-row"><div class="label">时间段</div><div class="chips">${slots.map((t,i)=>`<span class="chip sel-pick ${i===1?'sel':''}" data-t="${t}">${t}</span>`).join('')}</div></div><div class="form-row"><div class="label">上门地点</div><input id="bkPlace" placeholder="如：昆仑校区体育训练馆" value="昆仑校区 体育训练馆"></div></div><div class="card summary-box"><div class="ord-line"><span>服务</span><span class="bold">${esc(s.name)}（${s.dur}分钟）</span></div><div class="ord-line"><span>单价</span><span class="price">¥${s.price}/${s.unit}</span></div><div class="ord-line"><span>支付方式</span><span>虚拟余额支付（当前 ¥${DB.balance.toFixed(0)}）</span></div><div class="ord-line" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span class="bold">合计</span><span class="price f20">¥${s.price}</span></div></div><button class="btn primary block" data-action="submitOrder" data-sid="${s.id}" data-cid="${selCid}">确认下单</button><div class="f12 t3 mt8" style="text-align:center">下单后教练接单；接单前可随时取消，余额自动退回</div>`;}
function vOrderDetail(q){const id=parseInt(new URLSearchParams(q||'').get('id'));const o=DB.orders.find(x=>x.id===id);if(!o)return '<div class="empty">订单不存在</div>';const s=DB.services.find(x=>x.id===o.sid);const c=DB.coaches.find(x=>x.id===o.cid);const steps=[['pending','待接单'],['accepted','已接单'],['doing','进行中'],['done','已完成']];const idx=steps.findIndex(x=>x[0]===o.status);const isCancel=o.status==='canceled';const role=DB.role;return `<div class="card"><div class="ord-head"><span class="bold f16">${s?esc(s.name):''}</span><span class="badge ${o.status}">${statusText(o.status)}</span></div><div class="flex gap8 mt8"><div class="avatar" style="width:44px;height:44px;font-size:17px;background:${['#0E7C5C','#2F7BE5','#E5484D','#8A5CF5','#FF8A3D','#0A5E46'][o.cid%6]}">${c?esc(c.name[0]):'?'}</div><div><div class="bold">${c?esc(c.name):'-'}（${c?esc(c.major):''}专项）</div><div class="f12 t2">下单人：${esc(o.user)}</div></div></div></div>${isCancel?'<div class="card" style="background:var(--red-l);box-shadow:none;color:var(--red);font-size:14px">该订单已取消，金额已退回虚拟余额</div>':`<div class="card"><div class="steps">${steps.map(([k,t],i)=>`<div class="st ${i<=idx?'on':''}"><div class="dot" style="${i<steps.length-1?'':'margin-bottom:4px'}">${i<idx||o.status==='done'?'✓':i+1}</div><span>${t}</span><div class="line" style="${i===steps.length-1?'display:none':''}"></div></div>`).join('')}</div></div>`}<div class="card"><div class="ord-line"><span>订单号</span><span>#${o.id}</span></div><div class="ord-line"><span>训练时间</span><span>${o.date} ${o.time}</span></div><div class="ord-line"><span>上门地点</span><span>${esc(o.place)}</span></div><div class="ord-line"><span>下单时间</span><span>${fmtTime(o.created)}</span></div><div class="ord-line"><span>订单金额</span><span class="price">¥${o.amount}</span></div></div>${o.status==='done'&&o.rating?`<div class="card"><div class="bold">我的评价</div><div class="stars mt4" style="font-size:15px">${'★'.repeat(o.rating)}${'☆'.repeat(5-o.rating)}</div><div class="f13 t2 mt4">${esc(o.comment)}</div></div>`:''}<div class="card flex gap8" style="flex-wrap:wrap">${role==='user'&&['pending','accepted'].includes(o.status)?`<button class="btn danger block" data-action="cancelOrder" data-id="${o.id}">取消订单（退余额）</button>`:''}${role==='user'&&o.status==='doing'?`<button class="btn primary block" data-action="confirmDone" data-id="${o.id}">确认训练完成</button>`:''}${role==='user'&&o.status==='done'&&!o.rating?`<button class="btn orange block" data-action="openRate" data-id="${o.id}">评价本次服务</button>`:''}${role==='coach'&&o.status==='pending'?`<button class="btn orange block" data-action="acceptOrder" data-id="${o.id}">立即接单</button>`:''}${role==='coach'&&o.status==='accepted'?`<button class="btn primary block" data-action="startOrder" data-id="${o.id}">开始服务</button>`:''}${role==='coach'&&o.status==='doing'?`<button class="btn primary block" data-action="finishOrder" data-id="${o.id}">完成服务（结算收入）</button>`:''}${role==='admin'?`<select class="block" data-action="adminStatus" data-id="${o.id}" style="margin-bottom:8px;width:100%"><option value="">管理员更改状态…</option><option value="pending">改为待接单</option><option value="accepted">改为已接单</option><option value="doing">改为进行中</option><option value="done">改为已完成</option><option value="canceled">改为已取消</option></select>`:''}</div>`;}
function vCoachHome(){const pend=DB.orders.filter(o=>o.status==='pending').sort((a,b)=>b.id-a.id);const mine=DB.orders.filter(o=>['accepted','doing'].includes(o.status)).length;return `<div class="stat-grid"><div class="stat-card"><div class="v" style="color:var(--orange)">${pend.length}</div><div class="k">可接订单</div></div><div class="stat-card"><div class="v">${mine}</div><div class="k">进行中</div></div><div class="stat-card"><div class="v">${DB.orders.filter(o=>o.status==='done').length}</div><div class="k">已完成</div></div></div><div class="sec-title">接单大厅</div>${pend.map(coachOrderCard).join('')}${pend.length?'':'<div class="empty">暂无待接订单<br>可去学生端下一个单来体验接单</div>'}`;}
function coachOrderCard(o){const s=DB.services.find(x=>x.id===o.sid);return `<div class="card"><div class="ord-head"><span class="bold">${s?esc(s.name):''}</span><span class="badge pending">待接单</span></div><div class="ord-line"><span>下单人</span><span>${esc(o.user)}</span></div><div class="ord-line"><span>时间</span><span>${o.date} ${o.time}</span></div><div class="ord-line"><span>地点</span><span>${esc(o.place)}</span></div><div class="flex between mt8"><span class="price f20">¥${o.amount}</span><button class="btn orange" data-action="acceptOrder" data-id="${o.id}">接单</button></div></div>`;}
function vCoachOrders(){const mine=DB.orders.filter(o=>['accepted','doing','done','canceled'].includes(o.status)).sort((a,b)=>b.id-a.id);return `<div class="sec-title">我的接单</div>${mine.map(o=>{const s=DB.services.find(x=>x.id===o.sid);return `<div class="card" data-nav="/order?id=${o.id}"><div class="ord-head"><span class="bold">${s?esc(s.name):''}</span><span class="badge ${o.status}">${statusText(o.status)}</span></div><div class="ord-line"><span>下单人</span><span>${esc(o.user)}</span></div><div class="ord-line"><span>时间</span><span>${o.date} ${o.time}</span></div><div class="ord-line"><span>地点</span><span>${esc(o.place)}</span></div><div class="flex between mt8"><span class="price">¥${o.amount}</span><span class="f12 t3">${fmtTime(o.created)}</span></div></div>`;}).join('')}${mine.length?'':'<div class="empty">还没有接过单</div>'}`;}
function vCoachStats(){const done=DB.orders.filter(o=>o.status==='done');const earn=Object.values(DB.coachEarn).reduce((a,b)=>a+b,0);return `<div class="stat-grid"><div class="stat-card"><div class="v">¥${earn.toFixed(0)}</div><div class="k">累计收入</div></div><div class="stat-card"><div class="v">${done.length}</div><div class="k">完成订单</div></div><div class="stat-card"><div class="v">${DB.orders.filter(o=>o.status==='doing').length}</div><div class="k">待完成</div></div></div><div class="sec-title">收入明细</div>${done.map(o=>{const s=DB.services.find(x=>x.id===o.sid);return `<div class="card flex between"><div><div class="bold">${s?esc(s.name):''}</div><div class="f12 t3">${o.date} · 下单人 ${esc(o.user)}</div></div><span class="price">+¥${o.amount}</span></div>`;}).join('')}${done.length?'':'<div class="empty">完成订单后，收入会显示在这里</div>'}`;}
function vAdminHome(){const all=DB.orders;const st=x=>all.filter(o=>o.status===x).length;const doneSum=all.filter(o=>o.status==='done').reduce((a,b)=>a+b.amount,0);return `<div class="admin-head"><div class="f12" style="color:rgba(255,255,255,.7)">平台订单总览</div><div class="big">${all.length}<span style="font-size:14px;font-weight:400;opacity:.7"> 单</span></div><div class="f12" style="color:rgba(255,255,255,.8)">已完成订单金额 ¥${doneSum.toFixed(0)}</div></div><div class="stat-grid"><div class="stat-card"><div class="v" style="color:var(--orange)">${st('pending')}</div><div class="k">待接单</div></div><div class="stat-card"><div class="v" style="color:var(--blue)">${st('accepted')}</div><div class="k">已接单</div></div><div class="stat-card"><div class="v" style="color:var(--green)">${st('doing')}</div><div class="k">进行中</div></div></div><div class="stat-grid mt8"><div class="stat-card"><div class="v">${st('done')}</div><div class="k">已完成</div></div><div class="stat-card"><div class="v" style="color:var(--red)">${st('canceled')}</div><div class="k">已取消</div></div><div class="stat-card"><div class="v">${DB.services.length}</div><div class="k">服务项目</div></div></div><div class="sec-title">快捷入口</div><div class="grid2"><div class="card" style="text-align:center;padding:18px" data-nav="/admin/orders"><div style="color:var(--green)">${IC.order}</div><div class="bold mt4">订单管理</div></div><div class="card" style="text-align:center;padding:18px" data-nav="/admin/services"><div style="color:var(--orange)">${IC.service}</div><div class="bold mt4">服务管理</div></div><div class="card" style="text-align:center;padding:18px" data-nav="/admin/coaches"><div style="color:var(--blue)">${IC.coach}</div><div class="bold mt4">教练管理</div></div><div class="card" style="text-align:center;padding:18px" data-nav="/profile"><div style="color:var(--t2)">${IC.me}</div><div class="bold mt4">切换角色</div></div></div>`;}
function vAdminOrders(){const sts=['全部','pending','accepted','doing','done','canceled'];const qs=new URLSearchParams(location.hash.split('?')[1]||'');const cur=qs.get('st')||'全部';const list=(cur==='全部'?DB.orders:DB.orders.filter(o=>o.status===cur)).sort((a,b)=>b.id-a.id);return `<div class="chips" style="margin-bottom:12px;position:sticky;top:48px;background:var(--card);padding:6px 0;z-index:10">${sts.map(s=>`<span class="chip ${cur===s?'sel':''}" data-nav="/admin/orders?st=${s}">${s==='全部'?'全部':statusText(s)}</span>`).join('')}</div>${list.map(o=>{const s=DB.services.find(x=>x.id===o.sid);const c=DB.coaches.find(x=>x.id===o.cid);return `<div class="card" data-nav="/order?id=${o.id}"><div class="ord-head"><span class="bold">#${o.id} ${s?esc(s.name):''}</span><span class="badge ${o.status}">${statusText(o.status)}</span></div><div class="ord-line"><span>用户</span><span>${esc(o.user)} · 教练 ${c?esc(c.name):'-'}</span></div><div class="ord-line"><span>时间</span><span>${o.date} ${o.time} · ${esc(o.place)}</span></div><div class="ord-line"><span>金额</span><span class="price">¥${o.amount}</span></div></div>`;}).join('')}${list.length?'':'<div class="empty">暂无'+(cur==='全部'?'':'该状态的')+'订单</div>'}`;}
function vAdminServices(){return `<div class="card" style="background:var(--gray);box-shadow:none"><div class="bold" style="margin-bottom:10px">新增服务项目</div><div class="grid2" style="gap:8px"><input id="asName" placeholder="名称，如：排球专项训练"><select id="asCat"><option>排球</option><option>篮球</option><option>体能</option><option>私教</option><option>陪练</option></select><input id="asPrice" type="number" placeholder="价格(元/小时)"><input id="asDur" type="number" placeholder="时长(分钟)"><input id="asDesc" placeholder="一句话简介" style="grid-column:1/-1"></div><button class="btn primary block mt8" data-action="addService">添加服务</button></div>${DB.services.map(s=>`<div class="card flex between"><div style="flex:1"><div class="bold">${esc(s.name)} <span class="tag">${esc(s.cat)}</span></div><div class="f12 t2 mt4">${esc(s.desc)}</div><div class="f12 t3 mt4">${s.dur}分钟 · 热门：${s.hot?'是':'否'}</div></div><div style="text-align:right"><div class="price">¥${s.price}</div><button class="btn danger sm mt4" data-action="delService" data-id="${s.id}">删除</button></div></div>`).join('')}`;}
function vAdminCoaches(){return `<div class="card" style="background:var(--gray);box-shadow:none"><div class="bold" style="margin-bottom:10px">新增教练</div><div class="grid2" style="gap:8px"><input id="acName" placeholder="姓名"><select id="acMajor"><option>排球</option><option>篮球</option><option>体能</option><option>私教</option><option>陪练</option></select><input id="acPrice" type="number" placeholder="价格(元/小时)"><input id="acIntro" placeholder="简介：专项/经验" style="grid-column:1/-1"></div><button class="btn primary block mt8" data-action="addCoach">添加教练</button></div>${DB.coaches.map(c=>`<div class="card flex between"><div class="flex gap8" style="flex:1"><div class="avatar" style="width:44px;height:44px;font-size:16px;background:${['#0E7C5C','#2F7BE5','#E5484D','#8A5CF5','#FF8A3D','#0A5E46'][c.id%6]}">${esc(c.name[0])}</div><div><div class="bold">${esc(c.name)} <span class="tag">${esc(c.major)}</span></div><div class="f12 t2">${esc(c.intro)}</div><div class="f12 t3">★${c.rate.toFixed(1)} · 累计${c.cnt}单</div></div></div><div style="text-align:right"><div class="price">¥${c.price}</div><button class="btn danger sm mt4" data-action="delCoach" data-id="${c.id}">删除</button></div></div>`).join('')}`;}
let SHEET_CTX=null;
function openSheet(html,ctx){SHEET_CTX=ctx||null;const s=$('sheet');s.innerHTML=html;s.classList.add('show');$('sheetMask').classList.add('show');s.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{const a=el.dataset.action;if(ACTIONS[a])ACTIONS[a](el,e);}));s.querySelectorAll('.star-pick').forEach(el=>el.addEventListener('click',()=>{s.querySelectorAll('.star-pick').forEach(x=>x.classList.toggle('sel',+x.dataset.v<=+el.dataset.v));s.querySelectorAll('.star-pick').forEach(x=>x.style.color=+x.dataset.v<=+el.dataset.v?'var(--orange)':'#D8DEDA');}));}
function closeSheet(){$('sheet').classList.remove('show');$('sheetMask').classList.remove('show');SHEET_CTX=null;}
function bindEvents(root){root.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.nav)));root.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>toast(el.dataset.toast)));root.querySelectorAll('[data-action]:not(select)').forEach(el=>el.addEventListener('click',e=>{const a=el.dataset.action;if(ACTIONS[a])ACTIONS[a](el,e);}));root.querySelectorAll('select[data-action]').forEach(el=>el.addEventListener('change',e=>{const a=el.dataset.action;if(ACTIONS[a])ACTIONS[a](el,e);}));root.querySelectorAll('.sel-pick').forEach(el=>el.addEventListener('click',()=>{el.parentElement.querySelectorAll('.sel-pick').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}));}
const ACTIONS={setrole(el){const r=el.dataset.role;DB.role=r;save();const names={user:'学生端',coach:'教练端（阿迪力）',admin:'管理端'};toast('已切换到'+names[r]);go(r==='user'?'#/home':r==='coach'?'#/coach':'#/admin');},recharge(){DB.balance+=50;save();toast('模拟充值 +50，余额 ¥'+DB.balance.toFixed(0));render();},submitOrder(el){const sid=+el.dataset.sid,cid=+el.dataset.cid;const s=DB.services.find(x=>x.id===sid),c=DB.coaches.find(x=>x.id===cid);const dateEl=document.querySelector('#view .sel-pick[data-d].sel');const timeEl=document.querySelector('#view .sel-pick[data-t].sel');const place=(document.getElementById('bkPlace')||{}).value;if(!dateEl){toast('请选择训练日期');return;}if(!timeEl){toast('请选择时间段');return;}if(!place||!place.trim()){toast('请填写上门地点');return;}if(DB.balance<s.price){toast('余额不足，需 ¥'+s.price+'，请先充值');return;}const html=`<div class="handle"></div><div class="bold f16" style="margin-bottom:12px">确认下单</div><div class="ord-line"><span>服务</span><span class="bold">${esc(s.name)}</span></div><div class="ord-line"><span>教练</span><span>${esc(c.name)}（${esc(c.major)}专项）</span></div><div class="ord-line"><span>时间</span><span>${dateEl.dataset.d} ${timeEl.dataset.t}</span></div><div class="ord-line"><span>地点</span><span>${esc(place.trim())}</span></div><div class="ord-line" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span class="bold">支付</span><span class="price f20">¥${s.price}</span></div><div class="f12 t3 mt4">将从虚拟余额扣款（当前 ¥${DB.balance.toFixed(0)}），接单前可随时取消退款</div><button class="btn primary block mt16" data-action="doSubmit">确认支付并下单</button>`;openSheet(html,{sid,cid,s,date:dateEl.dataset.d,time:timeEl.dataset.t,place:place.trim(),amount:s.price});},doSubmit(){const c=SHEET_CTX;if(!c)return;DB.balance-=c.amount;const o={id:Math.floor(100000+Math.random()*899999),sid:c.sid,cid:c.cid,date:c.date,time:c.time,place:c.place,amount:c.amount,status:'pending',created:now(),user:'张家旗',rating:0,comment:''};DB.orders.unshift(o);save();closeSheet();toast('下单成功，等待教练接单');go('#/order?id='+o.id);},cancelOrder(el){const id=+el.dataset.id,o=DB.orders.find(x=>x.id===id);if(!o)return;if(o.status==='canceled'){toast('订单已取消');return;}if(!['pending','accepted'].includes(o.status)){toast('当前状态不可取消');return;}o.status='canceled';DB.balance+=o.amount;save();toast('已取消，¥'+o.amount+' 退回余额');render();},acceptOrder(el){const id=+el.dataset.id,o=DB.orders.find(x=>x.id===id);if(!o||o.status!=='pending'){toast('订单状态已变化');return;}o.status='accepted';save();toast('接单成功，记得按时上门');render();},startOrder(el){const id=+el.dataset.id,o=DB.orders.find(x=>x.id===id);if(!o||o.status!=='accepted'){toast('订单状态已变化');return;}o.status='doing';save();toast('服务已开始');render();},finishOrder(el){const id=+el.dataset.id,o=DB.orders.find(x=>x.id===id);if(!o||o.status!=='doing'){toast('订单状态已变化');return;}o.status='done';o.finishAt=now();DB.coachEarn[o.cid]=(DB.coachEarn[o.cid]||0)+o.amount;save();toast('服务完成，收入 +¥'+o.amount);render();},confirmDone(el){const id=+el.dataset.id,o=DB.orders.find(x=>x.id===id);if(!o||o.status!=='doing'){toast('订单状态已变化');return;}o.status='done';o.finishAt=now();DB.coachEarn[o.cid]=(DB.coachEarn[o.cid]||0)+o.amount;save();toast('已确认完成，教练收入已结算');render();},openRate(el){const html=`<div class="handle"></div><div class="bold f16" style="margin-bottom:12px">评价本次服务</div><div class="flex gap4" style="justify-content:center;font-size:30px;margin-bottom:12px">${[1,2,3,4,5].map(v=>`<span class="star-pick" data-v="${v}" style="cursor:pointer;color:#D8DEDA">★</span>`).join('')}</div><textarea id="rateComment" placeholder="说两句吧（选填）" rows="2" style="margin-bottom:12px"></textarea><button class="btn primary block" data-action="doRate">提交评价</button>`;openSheet(html,{id:+el.dataset.id});},doRate(){const c=SHEET_CTX;if(!c)return;const o=DB.orders.find(x=>x.id===c.id);if(!o)return;const starEl=$('sheet').querySelector('.star-pick.sel');const v=starEl?+starEl.dataset.v:5;o.rating=v;o.comment=($('rateComment').value||'').trim();const coach=DB.coaches.find(x=>x.id===o.cid);if(coach){coach.rate=Math.round((coach.rate*coach.cnt+v)/(coach.cnt+1)*10)/10;coach.cnt++;}save();closeSheet();toast('评价已提交，谢谢反馈');render();},addService(){const n=($('asName').value||'').trim();if(!n){toast('请填写服务名称');return;}DB.services.push({id:Math.max(...DB.services.map(s=>s.id))+1,cat:$('asCat').value,name:n,price:Math.max(0,+($('asPrice').value))||80,unit:'小时',dur:Math.max(0,+($('asDur').value))||60,hot:0,desc:($('asDesc').value||'').trim()||'暂无简介'});save();toast('服务已添加');render();},delService(el){const id=+el.dataset.id;if(DB.orders.some(o=>o.sid===id&&['pending','accepted','doing'].includes(o.status))){toast('该服务有进行中订单，不能删除');return;}DB.services=DB.services.filter(s=>s.id!==id);save();toast('服务已删除');render();},addCoach(){const n=($('acName').value||'').trim();if(!n){toast('请填写教练姓名');return;}DB.coaches.push({id:Math.max(...DB.coaches.map(c=>c.id))+1,name:n,major:$('acMajor').value,intro:($('acIntro').value||'').trim()||'暂无简介',price:Math.max(0,+($('acPrice').value))||60,rate:5.0,cnt:0,tags:[]});save();toast('教练已添加');render();},delCoach(el){const id=+el.dataset.id;if(DB.orders.some(o=>o.cid===id&&['pending','accepted','doing'].includes(o.status))){toast('该教练有进行中订单，不能删除');return;}DB.coaches=DB.coaches.filter(c=>c.id!==id);save();toast('教练已删除');render();},adminStatus(el){const id=+el.dataset.id,o=DB.orders.find(x=>x.id===id);if(!o)return;const v=el.value;if(!v)return;o.status=v;save();toast('订单状态已改为 '+statusText(v));render();}};
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
